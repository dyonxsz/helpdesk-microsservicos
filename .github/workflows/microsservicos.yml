name: Testes dos microsserviços

on:
  push:
  pull_request:

jobs:
  testes:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: usuarios
            pasta: servicos/usuarios
          - nome: inventario
            pasta: servicos/inventario
          - nome: chamados
            pasta: servicos/chamados
          - nome: notificacoes
            pasta: servicos/notificacoes
          - nome: gateway
            pasta: gateway
    defaults:
      run:
        working-directory: ${{ matrix.pasta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.pasta }}/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Testes
        run: pytest -q
      - name: Auditar dependências
        run: pip-audit -r requirements.txt

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar o compose
        env:
          JWT_SEGREDO: segredo-de-ci-com-mais-de-32-caracteres
        run: docker compose config -q
      - name: Construir as imagens
        env:
          JWT_SEGREDO: segredo-de-ci-com-mais-de-32-caracteres
        run: docker compose build
